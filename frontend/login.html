<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>(function(){try{var t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}})()</script>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<title>Sign in | BTree CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f1f1f1;--card:#fff;--card2:#f7f7f8;--ink:#030c20;--mute:#5a6070;--line:#e0e1e5;--brand:#1a5bec;--brand-d:#1349c2;--on-brand:#fff;--accent:#00b8f6;--ring:rgba(26,91,236,.16);--bad:#b42318;--bad-bg:#fde4e1;--shadow:0 20px 60px rgba(3,12,32,.12)}
:root[data-theme=dark]{--bg:#030c20;--card:#09152e;--card2:#071029;--ink:#f1f1f1;--mute:#9aa2b4;--line:#17233f;--brand:#1a5bec;--brand-d:#3a74f5;--on-brand:#fff;--accent:#00b8f6;--ring:rgba(0,184,246,.2);--bad:#f87171;--bad-bg:rgba(248,113,113,.14);--shadow:0 24px 70px rgba(0,0,0,.5)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]):not([data-theme=dark]){--bg:#030c20;--card:#09152e;--card2:#071029;--ink:#f1f1f1;--mute:#9aa2b4;--line:#17233f;--brand:#1a5bec;--brand-d:#3a74f5;--on-brand:#fff;--accent:#00b8f6;--ring:rgba(0,184,246,.2);--bad:#f87171;--bad-bg:rgba(248,113,113,.14);--shadow:0 24px 70px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px 16px;background:var(--bg);color:var(--ink);font:15px/1.5 'Plus Jakarta Sans',system-ui,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
form{width:100%;max-width:525px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:44px 44px 36px;box-shadow:var(--shadow);text-align:center}
.logo{height:104px;margin:0 auto 16px;display:flex;justify-content:center}.logo img{height:100%;width:auto}
h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.ver{color:var(--mute);font-size:13px;margin:4px 0 26px}
label{display:block;text-align:left;font-size:14px;font-weight:600;margin:0 0 8px}
.pw{position:relative}
input{width:100%;padding:15px 52px 15px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card2);color:var(--ink);font:inherit;outline:0;transition:.15s}
input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
input::placeholder{color:var(--mute);opacity:.75}
.show{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mute);cursor:pointer;padding:6px;display:grid;place-items:center;width:34px;height:34px;border-radius:8px}
.show:hover{color:var(--ink)}.show svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button.go{margin-top:22px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--brand);color:var(--on-brand);font:700 16px 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer;transition:.15s}
button.go:hover{background:var(--brand-d)}button.go:disabled{opacity:.6;cursor:wait}
#err{margin-top:16px;font-size:13.5px;color:var(--bad);background:var(--bad-bg);padding:11px 14px;border-radius:12px;display:none;text-align:left}
.help{margin:24px 0 0;color:var(--ink);font-size:14.5px}.help a{color:var(--brand);font-weight:600;text-decoration:none}.help a:hover{text-decoration:underline}
.foot{color:var(--mute);font-size:13px;text-align:center}
.theme{position:fixed;top:18px;right:18px;z-index:30;width:60px;height:32px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;padding:0}
.theme .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--brand);transition:transform .22s cubic-bezier(.4,0,.2,1)}
.theme svg{position:absolute;top:7px;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.theme .sun{left:8px;color:var(--on-brand)}.theme .moon{right:8px;color:var(--mute)}
:root[data-theme=dark] .theme .knob{transform:translateX(28px)}
:root[data-theme=dark] .theme .sun{color:var(--mute)}:root[data-theme=dark] .theme .moon{color:var(--on-brand)}
input.plain{padding-right:16px;margin-bottom:16px}
@media(max-width:520px){form{padding:32px 22px 28px}}
</style>
</head>
<body>
<button class="theme" id="theme" type="button" role="switch" aria-label="Dark mode" title="Switch light / dark"><span class="knob"></span><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
<form id="f">
  <div class="logo"><img src="/logo.svg" alt="BTree"></div>
  <h1>BTree CRM</h1><div class="ver" id="ver">WhatsApp for admissions</div>
  <div id="nameRow" hidden><label for="nm">Your name</label><input id="nm" class="plain" autocomplete="name" placeholder="e.g. Ravi Kumar"></div>
  <label for="un">Username</label>
  <input id="un" class="plain" autocomplete="username" placeholder="Enter your username" required autofocus autocapitalize="none" spellcheck="false">
  <label for="pw">Password</label>
  <div class="pw"><input id="pw" type="password" placeholder="Enter your password" autocomplete="current-password" required>
    <button type="button" class="show" id="show" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
  <button class="go" id="go">Sign in</button>
  <div id="err" role="alert"></div>
  <p class="help" id="help">Forgot your password? Ask an admin to reset it.</p>
</form>
<div class="foot">BTree Systems · Admissions CRM</div>
<script>
(function(){var b=document.getElementById('theme');if(!b)return;
var cur=function(){return document.documentElement.dataset.theme==='dark'?'dark':'light'};
var sync=function(){b.setAttribute('aria-checked',cur()==='dark')};sync();
b.onclick=function(){var n=cur()==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('theme',n)}catch(e){}sync()};
})();
</script>
<script>
const $ = id => document.getElementById(id);
const pw = $('pw'), un = $('un'), nm = $('nm'), err = $('err'), go = $('go');
let setup = false;
$('show').onclick = () => { pw.type = pw.type === 'password' ? 'text' : 'password'; pw.focus(); };
fetch('/api/auth/me').then(r => r.json()).then(m => {
  if (m.signed_in) return location.replace('/');
  if (m.needs_setup) {  // first run: no accounts yet, create the admin
    setup = true; $('nameRow').hidden = false; nm.required = true; nm.focus();
    document.querySelector('h1').textContent = 'Create the admin account';
    $('ver').textContent = 'First-time setup. This account can add everyone else.';
    pw.placeholder = 'At least 8 characters'; pw.autocomplete = 'new-password';
    go.textContent = 'Create admin account'; $('help').hidden = true;
  }
}).catch(() => {});
$('f').onsubmit = async e => {
  e.preventDefault(); go.disabled = true; err.style.display = 'none';
  try {
    const body = setup ? {name: nm.value, username: un.value.trim(), password: pw.value} : {username: un.value.trim(), password: pw.value};
    const r = await fetch(setup ? '/api/auth/setup' : '/api/auth/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    const j = await r.json().catch(() => ({}));
    if (r.ok) { location.replace('/'); return; }
    err.textContent = typeof j.detail === 'string' ? j.detail : 'Could not sign in.';
  } catch (_) { err.textContent = 'Could not reach the server.'; }
  err.style.display = 'block'; go.disabled = false; pw.select();
};
</script>
</body>
</html>
