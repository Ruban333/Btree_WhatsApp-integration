<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>(function(){try{var t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;if(localStorage.getItem('side')==='1')document.documentElement.classList.add('collapsed')}catch(e){}})()</script>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<title>BTree CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#f1f1f1;--side:#fff;--card:#fff;--card2:#f7f7f8;--ink:#030c20;--mute:#5a6070;--line:#e0e1e5;--soft:#ececee;
  --brand:#1a5bec;--brand-d:#1349c2;--brand-soft:rgba(26,91,236,.09);--on-brand:#fff;--brand-ink:#1a5bec;--accent:#00b8f6;
  --ok:#0f7a4a;--ok-bg:#dcf5e8;--warn:#a85d00;--warn-bg:#fdf0d2;--bad:#b42318;--bad-bg:#fde4e1;--info:#1a5bec;--info-bg:rgba(26,91,236,.1);--idle:#383d48;--idle-bg:#e4e5e9;
  --in:#fff;--out:#dce7ff;--chat-bg:#e9ebf0;--shadow:0 1px 2px rgba(3,12,32,.05),0 6px 18px rgba(3,12,32,.05);--r:14px
}
:root[data-theme=dark]{
  --bg:#030c20;--side:#050f27;--card:#09152e;--card2:#071029;--ink:#f1f1f1;--mute:#9aa2b4;--line:#17233f;--soft:#0c1a38;
  --brand:#1a5bec;--brand-d:#3a74f5;--brand-soft:rgba(0,184,246,.12);--on-brand:#fff;--brand-ink:#00b8f6;--accent:#00b8f6;
  --ok:#4ade80;--ok-bg:rgba(74,222,128,.14);--warn:#fbbf24;--warn-bg:rgba(251,191,36,.13);--bad:#f87171;--bad-bg:rgba(248,113,113,.14);--info:#00b8f6;--info-bg:rgba(0,184,246,.13);--idle:#a4acbd;--idle-bg:rgba(56,61,72,.6);
  --in:#0f1d3b;--out:#143f98;--chat-bg:#040e24;--shadow:none}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]):not([data-theme=dark]){
  --bg:#030c20;--side:#050f27;--card:#09152e;--card2:#071029;--ink:#f1f1f1;--mute:#9aa2b4;--line:#17233f;--soft:#0c1a38;
  --brand:#1a5bec;--brand-d:#3a74f5;--brand-soft:rgba(0,184,246,.12);--on-brand:#fff;--brand-ink:#00b8f6;--accent:#00b8f6;
  --ok:#4ade80;--ok-bg:rgba(74,222,128,.14);--warn:#fbbf24;--warn-bg:rgba(251,191,36,.13);--bad:#f87171;--bad-bg:rgba(248,113,113,.14);--info:#00b8f6;--info-bg:rgba(0,184,246,.13);--idle:#a4acbd;--idle-bg:rgba(56,61,72,.6);
  --in:#0f1d3b;--out:#143f98;--chat-bg:#040e24;--shadow:none}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.5 'Plus Jakarta Sans',system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
svg.i{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* shell */
.app{display:grid;grid-template-columns:268px 1fr;min-height:100vh;transition:grid-template-columns .2s}
.collapsed .app{grid-template-columns:78px 1fr}
aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:5}
.brand{display:flex;align-items:center;gap:12px;padding:22px 20px 20px;border-bottom:1px solid var(--line);position:relative;min-height:84px}
.brand img{height:42px;width:auto;flex:none}
.brand b{display:block;font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.2}.brand small{color:var(--mute);font-size:12px}
.fold{position:absolute;right:-14px;top:30px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--mute);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:var(--shadow)}
.fold:hover{color:var(--ink)}.fold svg{width:15px;height:15px;transition:transform .2s}.collapsed .fold svg{transform:rotate(180deg)}
nav{display:flex;flex-direction:column;gap:4px;padding:16px 14px;overflow-y:auto;flex:1}
nav button{display:flex;align-items:center;gap:14px;border:0;background:none;color:var(--ink);opacity:.82;padding:11px 14px;border-radius:12px;cursor:pointer;font:500 14.5px 'Plus Jakarta Sans',system-ui,sans-serif;text-align:left;transition:.15s;white-space:nowrap}
nav button:hover{background:var(--soft);opacity:1}
nav button.on{background:var(--brand-soft);color:var(--brand-ink);opacity:1;font-weight:600}
.side-foot{padding:14px;border-top:1px solid var(--line);display:grid;gap:8px}
.side-foot .status{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:12.5px;background:var(--card2)}
.side-foot .status b{display:block;font-size:13px;font-weight:600}.side-foot .status small{display:block;color:var(--mute);word-break:break-word}
button.out{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 14px;border-radius:12px;cursor:pointer;font:500 14px 'Plus Jakarta Sans',system-ui,sans-serif;transition:.15s;white-space:nowrap}
button.out:hover{background:var(--soft)}
.led{width:9px;height:9px;border-radius:50%;background:var(--idle);flex:none}
.led.ok{background:var(--ok);box-shadow:0 0 0 4px var(--ok-bg)}.led.warn{background:#fbbf24;box-shadow:0 0 0 4px var(--warn-bg)}.led.bad{background:var(--bad);box-shadow:0 0 0 4px var(--bad-bg)}
.collapsed .lbl,.collapsed .brand>div:not(.mark),.collapsed .side-foot .status>div{display:none}
.collapsed .brand{justify-content:center;padding-left:0;padding-right:0}.collapsed nav button,.collapsed button.out{justify-content:center;padding-left:0;padding-right:0}
.collapsed .side-foot .status{justify-content:center}

.content{min-width:0}
.top{display:flex;align-items:flex-start;gap:14px;padding:30px 36px 8px;flex-wrap:wrap}
.top h1{font-size:30px;font-weight:700;letter-spacing:-.03em;margin:0;line-height:1.15;display:inline-flex;align-items:center;gap:14px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--idle);border-radius:99px;padding:3px 0;background:none}
.chip.ok{color:var(--ok)}.chip.bad{color:var(--bad)}.chip.warn{color:var(--warn)}
.top p{margin:8px 0 0;color:var(--mute);font-size:15px}
.top .sp{flex:1}
main{padding:18px 36px 48px;max-width:1360px}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:20px;box-shadow:var(--shadow)}
.card>h2:first-child,.card h2.h{font-size:16px;font-weight:650;letter-spacing:-.01em;margin:0 0 16px}
h2{font-size:16px;margin:0 0 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;margin-bottom:20px}
.two>.card{margin-bottom:0}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-bottom:20px}
.grid.s{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat{margin:0!important;position:relative;overflow:hidden;padding:22px 24px}
.stat .lab{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink);opacity:.9}
.stat .lab svg{color:var(--mute);width:20px;height:20px}
.stat b{display:block;font-size:38px;font-weight:700;letter-spacing:-.03em;margin:14px 0 4px;line-height:1.1}
.stat span.sub{color:var(--mute);font-size:13px}
.stat .wm{position:absolute;right:-14px;bottom:-18px;width:96px;height:96px;opacity:.06;stroke-width:1.4;color:var(--ink);pointer-events:none}
.stat.sm b{font-size:30px;margin:10px 0 2px}
.sec{display:flex;align-items:center;gap:10px;margin:8px 0 14px}.sec h2{margin:0;font-size:19px;letter-spacing:-.01em}.sec svg{color:var(--mute)}.sec .sp{flex:1}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:2px}
.seg button{border:0;background:none;color:var(--ink);font:600 13.5px 'Plus Jakarta Sans',sans-serif;padding:7px 16px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.chartbox{border:1px dashed var(--line);border-radius:var(--r);background:var(--card);padding:18px 16px 10px}
.chartbox .none{display:grid;place-items:center;height:130px;color:var(--brand-ink)}
.legend{display:flex;gap:18px;font-size:12.5px;color:var(--mute);margin:0 0 8px 6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* tables */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:14px 14px;vertical-align:middle}
th{font-size:11.5px;color:var(--ink);font-weight:700;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;background:var(--card2)}
th:first-child{border-radius:12px 0 0 12px}th:last-child{border-radius:0 12px 12px 0}
td{border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--card2)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px}
td .who{display:flex;align-items:center;gap:12px}

/* forms */
input,select,textarea{font:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:10px 13px;max-width:100%;transition:.15s;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
input::placeholder,textarea::placeholder{color:var(--mute);opacity:.8}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand);padding:0}
textarea{width:100%;min-height:110px;resize:vertical}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin:12px 0 6px}
button.b{background:var(--brand);color:var(--on-brand);border:0;border-radius:11px;padding:10px 18px;cursor:pointer;font:700 13.5px 'Plus Jakarta Sans',system-ui,sans-serif;transition:.15s;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
button.b:hover{background:var(--brand-d)}button.b:active{transform:translateY(1px)}
button.b.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600}button.b.ghost:hover{background:var(--soft)}
button.b.danger{background:var(--card);color:var(--bad);border:1px solid var(--line);font-weight:600}button.b.danger:hover{background:var(--bad-bg)}
button.b.sm{padding:6px 12px;font-size:12.5px;border-radius:9px}
button:disabled,input:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--mute)}a{color:var(--brand-ink);text-decoration:none;font-weight:600}a:hover{text-decoration:underline}
code{background:var(--soft);border:1px solid var(--line);padding:1px 6px;border-radius:6px;font-size:12.5px}
.note{display:flex;gap:10px;background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.45;margin-bottom:16px}
.note svg{margin-top:1px}

/* pills + avatars */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 12px;border-radius:99px;background:var(--idle-bg);color:var(--idle);white-space:nowrap}
.pill.APPROVED,.pill.read,.pill.completed,.pill.delivered,.pill.ready,.pill.enrolled,.pill.yes{background:var(--ok-bg);color:var(--ok)}
.pill.DRAFT,.pill.PENDING,.pill.scheduled,.pill.sent,.pill.running,.pill.contacted,.pill.qr_ready,.pill.initializing,.pill.authenticating{background:var(--warn-bg);color:var(--warn)}
.pill.failed,.pill.REJECTED,.pill.cancelled,.pill.lost,.pill.no{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.new,.pill.interested,.pill.human,.pill.def{background:var(--info-bg);color:var(--info)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;flex:none}
.av.s{width:32px;height:32px;font-size:12px}

/* inbox */
.inbox{display:grid;grid-template-columns:330px 1fr;height:calc(100vh - 230px);min-height:480px;padding:0;overflow:hidden}
.convs{border-right:1px solid var(--line);overflow:auto;background:var(--card)}
.conv{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.conv:hover{background:var(--card2)}.conv.on{background:var(--brand-soft)}
.conv .tx{min-width:0;flex:1}.conv .tx b{display:flex;gap:8px;align-items:center;font-weight:600}
.conv small{color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.chat{display:flex;flex-direction:column;min-width:0;background:var(--chat-bg)}
.chat-h{display:flex;gap:12px;align-items:center;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.chat-h .nm{display:flex;flex-direction:column;line-height:1.25}.chat-h .nm span{font-size:12.5px;color:var(--mute)}
.msgs{flex:1;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:8px}
.msgs.muted{align-items:center;justify-content:center}
.m{max-width:68%;padding:8px 12px 6px;border-radius:14px;border-top-left-radius:4px;background:var(--in);white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 1px rgba(0,0,0,.08);line-height:1.45}
.m.out{align-self:flex-end;background:var(--out);border-radius:14px;border-top-right-radius:4px}
.m small{display:flex;gap:6px;align-items:center;justify-content:flex-end;color:var(--mute);font-size:11px;margin-top:3px}
.m small .pill{font-size:10px;padding:0 7px}.m .err{color:var(--bad)}
.composer{padding:12px 16px;display:flex;gap:10px;flex-wrap:wrap;background:var(--card);border-top:1px solid var(--line)}
.composer input{flex:1;min-width:160px;border-radius:99px;padding:10px 16px}
.composer select{border-radius:99px}
.preview{background:var(--out);border-radius:14px;padding:12px 14px;white-space:pre-wrap;min-height:70px}

/* misc */
.empty{padding:34px 10px;text-align:center;color:var(--mute)}
button.mecard{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 12px;border-radius:12px;cursor:pointer;text-align:left;font:inherit}
button.mecard:hover{background:var(--soft)}button.mecard b{display:block;font-size:13px;line-height:1.25}button.mecard small{color:var(--mute);font-size:12px}button.mecard small i{font-style:normal;text-transform:capitalize}
.collapsed button.mecard{justify-content:center;padding-left:0;padding-right:0}.collapsed button.mecard>div{display:none}
.perms{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 14px;margin-top:6px}
.perms label{display:flex;gap:9px;align-items:center;margin:0;color:var(--ink);font-weight:500;font-size:13.5px}
.matrix td,.matrix th{text-align:center;padding:10px}.matrix td:first-child,.matrix th:first-child{text-align:left}
.tick{color:var(--ok);font-weight:800}.dash{color:var(--mute)}
.btnrow{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--card2)}
.btnrow textarea{min-height:64px}
.btnrow .hd{display:flex;gap:10px;align-items:center}.btnrow .hd input{flex:1}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.opts span{display:block;text-align:center;background:var(--card);border:1px solid var(--line);color:var(--brand-ink);font-weight:600;border-radius:10px;padding:7px}
.rules{margin:12px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--mute);display:grid;gap:6px}
.rules b{color:var(--ink)}
.optbox{display:flex;gap:8px;align-items:baseline;margin:6px 0 0;padding:9px 12px;border:1px solid var(--brand);border-radius:10px;background:var(--brand-soft);color:var(--brand-ink);font-weight:600;text-decoration:none;white-space:normal}
.optbox:hover{text-decoration:none;filter:brightness(1.12)}.optbox .n{opacity:.7;font-weight:700}
.m .optbox:first-of-type{margin-top:10px}
.tap{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--brand-ink);margin-bottom:2px}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:60;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:99px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}
.qrbox{display:grid;place-items:center;min-height:260px;border:1.5px dashed var(--line);border-radius:14px;padding:16px;text-align:center}
.qrbox img{width:250px;height:250px;border-radius:12px;background:#fff;padding:8px}
.modal{position:fixed;inset:0;background:rgba(2,6,23,.6);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{max-width:440px;width:100%;margin:0;text-align:center}
.res{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto}

/* theme toggle */
.theme{position:relative;width:60px;height:32px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;padding:0;flex:none}
.theme .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--brand);transition:transform .22s cubic-bezier(.4,0,.2,1)}
.theme svg{position:absolute;top:7px;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:color .2s}
.theme .sun{left:8px;color:var(--on-brand)}.theme .moon{right:8px;color:var(--mute)}
:root[data-theme=dark] .theme .knob{transform:translateX(28px)}
:root[data-theme=dark] .theme .sun{color:var(--mute)}:root[data-theme=dark] .theme .moon{color:var(--on-brand)}
.theme:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- responsive ---------- */
.menu{display:none;flex:none;width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);place-items:center;cursor:pointer;padding:0;margin-top:2px}
.scrim{display:none}
.back{display:none}
.app>*{min-width:0}                 /* grid children may shrink: nothing can push the page wider than the screen */
.top,main{width:100%;max-width:1600px;margin-left:auto;margin-right:auto}
.top .hd{flex:1;min-width:0}
.grid,.grid.s{grid-template-columns:repeat(4,minmax(0,1fr))}
.two{align-items:stretch}           /* side-by-side cards share one height */
.sec{flex-wrap:wrap}
.chat-h .nm{min-width:0}.chat-h .nm b,.chat-h .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:1200px){.grid,.grid.s{grid-template-columns:repeat(2,minmax(0,1fr))}}
.two.wl{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
@media(max-width:1100px){.two,.two.wl{grid-template-columns:minmax(0,1fr)}}
@media(max-width:900px){
  /* sidebar becomes a slide-out drawer behind the menu button */
  .app,.collapsed .app{grid-template-columns:minmax(0,1fr)}
  aside{position:fixed;top:0;left:0;bottom:0;width:min(84vw,300px);height:100dvh;transform:translateX(-102%);transition:transform .25s ease;z-index:45;box-shadow:0 0 40px rgba(2,6,23,.35)}
  .nav-open aside{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(2,6,23,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
  .nav-open .scrim{opacity:1;pointer-events:auto}
  .nav-open body{overflow:hidden}
  .fold{display:none}
  .menu{display:grid}
  /* the desktop "collapsed" setting never applies inside the drawer */
  .collapsed .lbl,.collapsed .brand>div:not(.mark),.collapsed .side-foot .status>div,.collapsed button.mecard>div{display:revert}
  .collapsed nav button,.collapsed button.out,.collapsed button.mecard{justify-content:flex-start;padding-left:14px;padding-right:14px}
  .collapsed .brand{justify-content:flex-start;padding:22px 20px 20px}
  .top{padding:18px 16px 4px;gap:12px;align-items:flex-start}.top h1{font-size:24px;gap:10px}.top p{font-size:14px;margin-top:4px}

// ---------- analytics chart ----------
function barChart(data, range) {
  if (!data.some(d => d.in || d.out)) return '<div class="none">No message activity in this period.</div>';
  const W = 900, H = 250, L = 34, B = 28, T = 10, n = data.length, gw = (W - L) / n;
  const max = Math.max(...data.map(d => Math.max(d.in, d.out)));
  const step = Math.max(1, Math.ceil(max / 4)), top = step * Math.ceil(max / step);
  const y = v => T + (H - T - B) * (1 - v / top);
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--mute)">${v}</text>`;
  const every = range === '24h' ? 3 : range === '7d' ? 1 : 5;
  data.forEach((d, i) => {
    const x = L + gw * i + gw * .18, bw = Math.min(gw * .32, 22), dt = new Date(d.t);
    const label = range === '24h' ? dt.getHours().toString().padStart(2, '0') + ':00' : dt.toLocaleDateString([], range === '7d' ? {weekday: 'short'} : {day: 'numeric', month: 'short'});
    const tip = `${range === '24h' ? dt.toLocaleString([], {hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short'}) : dt.toLocaleDateString()}: ${d.out} sent, ${d.in} received`;
    g += `<g><title>${tip}</title><rect x="${x}" y="${y(d.out)}" width="${bw}" height="${H - B - y(d.out)}" rx="3" fill="var(--brand)"/>` +
         `<rect x="${x + bw + 2}" y="${y(d.in)}" width="${bw}" height="${H - B - y(d.in)}" rx="3" fill="var(--accent)"/></g>`;
    if (i % every === 0) g += `<text x="${L + gw * i + gw / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--mute)">${label}</text>`;
  });
  return `<div class="legend"><span><i style="background:var(--brand)"></i>Sent</span><span><i style="background:var(--accent)"></i>Received</span></div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}</svg>`;
}

        <label>Automatic reply when tapped (variables work here too)</label><textarea data-i="${i}" data-k="reply" placeholder="e.g. Great {{name}}! Your seat is reserved.">${esc(b.reply)}</textarea>

      $('#addb').style.display = btns.length >= 3 ? 'none' : '';

    f.body.oninput = $('#pl').onchange = pv; drawBtns(); pv();
    $('#tnew').onclick = () => { f.reset(); f.id.value = ''; f.name.readOnly = false; btns = []; $('#tt').textContent = 'New template'; drawBtns(); pv(); };
    f.onsubmit = guard(async e => { e.preventDefault();
      const p = {name: f.name.value, category: f.category.value, language: f.language.value, body: f.body.value, buttons: btns.filter(b => b.text.trim())};
      f.id.value ? await api('/templates/' + f.id.value, 'PUT', p) : await api('/templates', 'POST', p);
      toast('Saved as draft. Press Submit to approve it.'); render(); });
    document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { const t = tpls.find(x => x.id == b.dataset.edit);
      f.id.value = t.id; f.name.value = t.name; f.name.readOnly = true; f.category.value = t.category; f.language.value = t.language; f.body.value = t.body;
      btns = t.buttons.map(x => ({...x})); drawBtns();
      $('#tt').textContent = 'Edit template (editing resets approval)'; pv(); scrollTo(0, 0); });
    document.querySelectorAll('[data-sub]').forEach(b => b.onclick = guard(async () => { const r = await api(`/templates/${b.dataset.sub}/submit`, 'POST'); toast('Status: ' + r.status); render(); }));

  async Bot() {
    const data = await api('/bot/flow');

    const order = () => ['start', 'courses', ...Object.keys(F.nodes).filter(k => !['start', 'courses', 'handover'].includes(k)), 'handover'];

      const n = F.nodes[id], special = KIND[id];
      return `<div class="card btnrow" style="background:var(--card);margin-bottom:14px" data-node="${id}">
        <div class="row" style="justify-content:space-between;margin-bottom:6px"><div class="row" style="gap:8px">${pill(special ? 'def' : 'idle', special || 'Step')}<span class="muted mono" style="font-size:11.5px">${id}</span></div>
          ${special ? '' : `<button type="button" class="b danger sm" data-delnode="${id}">Delete step</button>`}</div>
        <label>Step name (only you see this)</label><input data-f="title" value="${esc(n.title)}" style="width:100%">
        <label>${id === 'courses' ? 'Message above the course list' : id === 'start' ? 'Welcome message (first message of a conversation)' : 'Message'}</label>
        <textarea data-f="text" style="min-height:76px">${esc(n.text)}</textarea>
        ${id === 'start' ? `<label>Main menu text (when the lead comes back to the menu)</label><input data-f="menu_text" value="${esc(n.menu_text || '')}" style="width:100%">` : ''}
        ${id === 'courses' ? `<label>Course details message. Variables: {{course}} {{fee}} {{duration}} {{batch_timing}} {{syllabus_url}} {{description}}</label><textarea data-f="detail" style="min-height:110px">${esc(n.detail)}</textarea>
          <p class="muted" style="font-size:12.5px;margin:8px 0 0">The numbered course list comes from your Courses page (${data.courses.length} course${data.courses.length === 1 ? '' : 's'}). The options below appear after a course's details.</p>` : ''}
        ${id === 'handover' ? `<p class="muted" style="font-size:12.5px;margin:8px 0 0">Every path should end here. Sending it pauses the bot, marks the lead <b>callback pending</b> and your counsellor takes over. Variables: {{name}} {{team_phone}}</p>` : `
        <label>Options (the lead replies with the number or taps the text)</label>
        ${(n.options || []).map((o, i) => `<div class="row" style="flex-wrap:nowrap;margin-bottom:8px"><b class="muted" style="width:18px">${i + 1}</b>
          <input data-opt="${i}" data-k="label" value="${esc(o.label)}" maxlength="60" placeholder="Option text" style="flex:1;min-width:0">
          <select data-opt="${i}" data-k="goto" style="flex:1;min-width:0">${gotoOpts(o.goto)}</select>
          <button type="button" class="b ghost sm" data-rmopt="${i}" aria-label="Remove option">✕</button></div>`).join('')}
        ${(n.options || []).length < 9 ? `<button type="button" class="b ghost sm" data-addopt="1">+ Add option</button>` : ''}`}
      </div>`;
    };
    const drawSteps = () => {
      $('#steps').innerHTML = order().map(stepCard).join('');
      $('#steps').querySelectorAll('[data-node]').forEach(card => {
        const id = card.dataset.node, n = F.nodes[id];
        card.querySelectorAll('[data-f]').forEach(el => el.oninput = () => { n[el.dataset.f] = el.value; if (el.dataset.f === 'title') refreshGotoLabels(); });
        card.querySelectorAll('[data-opt]').forEach(el => el[el.tagName === 'SELECT' ? 'onchange' : 'oninput'] = () => { n.options[+el.dataset.opt][el.dataset.k] = el.value; });
        card.querySelectorAll('[data-rmopt]').forEach(el => el.onclick = () => { n.options.splice(+el.dataset.rmopt, 1); drawSteps(); });
        const add = card.querySelector('[data-addopt]'); if (add) add.onclick = () => { n.options.push({label: '', goto: 'handover'}); drawSteps(); };
        const del = card.querySelector('[data-delnode]'); if (del) del.onclick = () => {
          if (!confirm(`Delete the step "${n.title}"? Options pointing to it will go to the main menu.`)) return;
          delete F.nodes[id];
          Object.values(F.nodes).forEach(x => (x.options || []).forEach(o => { if (o.goto === id) o.goto = 'start'; }));
          drawSteps(); };
      });
    };
    const refreshGotoLabels = () => document.querySelectorAll('#steps select[data-k="goto"]').forEach(s => { const v = s.value; s.innerHTML = gotoOpts(v); });
    $('#main').innerHTML = `
      ${data.ai_on ? `<div class="note">${ico('info')}<div>The AI Agent is switched on and answers first. Switch it off on the AI Agent page to use this menu chatbot.</div></div>` : ''}
      <div class="card"><div class="sec" style="margin-top:0"><h2>Menu chatbot</h2><span class="sp"></span>${F.enabled ? pill('yes', 'on') : pill('idle', 'off')}</div>
        <p class="muted" style="margin-top:0">Leads only pick from numbered options. Nothing is free-form: every answer is a message you set here, and every path ends with the counsellor hand-over.</p>
        <label class="row" style="gap:10px;color:var(--ink);font-weight:600"><input type="checkbox" id="fen" ${F.enabled ? 'checked' : ''}> Reply to incoming WhatsApp messages with this menu</label>
        <div class="row" style="align-items:flex-start">
          <div style="flex:1;min-width:200px"><label>Team contact number ({{team_phone}} in the hand-over)</label><input id="fphone" value="${esc(F.team_phone)}" placeholder="+91 98400 12345" style="width:100%"></div>
          <div style="flex:1 1 260px"><label>How leads pick an option</label><select id="fstyle" style="width:100%"><option value="links" ${F.option_style !== 'numbers' ? 'selected' : ''}>Tap an option, then Send (recommended)</option><option value="numbers" ${F.option_style === 'numbers' ? 'selected' : ''}>Reply with a number</option></select></div>
          <div style="flex:0 1 230px"><label>Wrong replies allowed before hand-over</label><input id="fmax" type="number" min="0" max="5" value="${F.max_invalid}" style="width:100%"></div></div>
        <label>Message when the reply is not one of the options</label><input id="finv" value="${esc(F.invalid_text)}" style="width:100%">
        <div class="row" style="margin-top:16px"><button class="b" id="fsave">Save chatbot</button></div></div>
      <div class="two wl">
        <div><div class="sec"><h2>Steps</h2><span class="sp"></span><button type="button" class="b ghost sm" id="addstep">+ Add step</button></div><div id="steps"></div>
          <button class="b" id="fsave2">Save chatbot</button></div>
        <div><div class="card" style="position:sticky;top:16px"><h2>Try it <span class="muted" style="font-weight:400;font-size:13px">(uses your unsaved changes, sends nothing)</span></h2>
          <div class="chat" style="border-radius:12px;padding:12px;height:420px;overflow:auto" id="tbox"></div>
          <form id="tform" class="row" style="margin-top:10px"><input id="tin" placeholder="Type like a lead, e.g. hi, then tap an option" style="flex:1" autocomplete="off"><button class="b">${ico('Tester')}Send</button><button type="button" class="b ghost" id="treset">Reset</button></form></div></div>
      </div>`;
    drawSteps();
    const collect = () => ({...F, option_style: $('#fstyle').value, enabled: $('#fen').checked, team_phone: $('#fphone').value, max_invalid: +$('#fmax').value || 0, invalid_text: $('#finv').value});
    const save = guard(async () => { const r = await api('/bot/flow', 'PUT', collect()); Object.assign(F, r.flow); toast(F.enabled ? 'Saved. The menu chatbot is answering WhatsApp messages.' : 'Saved. The menu chatbot is off.'); });
    $('#fsave').onclick = save; $('#fsave2').onclick = save;
    $('#addstep').onclick = () => { let i = 1; while (F.nodes['step_' + i]) i++;
      F.nodes['step_' + i] = {title: 'New step', text: 'Write the reply for this step.', options: [{label: 'Main menu', goto: 'start'}, {label: 'Talk to a counsellor', goto: 'handover'}]};
      drawSteps(); refreshGotoLabels(); toast('Step added. Point an option to it so leads can reach it.'); };
    // option links (https://wa.me/<number>?text=<option>) become tappable: a tap "types" the option and sends it, like on a phone
    const linkify = t => esc(t)
      .replace(/(\d+)\. ([^\n]+)\nhttps:\/\/wa\.me\/\d+\?text=(\S+)/g, (_, n, label, enc) => `<a href="#" class="optbox" data-pick="${enc}"><span class="n">${n}.</span> ${label}</a>`)
      .replace(/\s*(<a href="#" class="optbox")/g, '$1')   // no stray blank lines around the boxes
      .replace(/\*([^*\n]+)\*/g, '<b>$1</b>');
    const drawChat = () => { $('#tbox').innerHTML = tlog.length ? `<div class="msgs" style="padding:0">${tlog.map(m => `<div class="m ${m.who}">${linkify(m.text)}</div>`).join('')}</div>` : '<div class="msgs muted" style="padding:0">Send any message to start, like a new lead would.</div>'; $('#tbox').scrollTop = 1e6; };
    drawChat();
    $('#tbox').onclick = e => { const a = e.target.closest('[data-pick]'); if (a) { e.preventDefault(); $('#tin').value = decodeURIComponent(a.dataset.pick); $('#tform').requestSubmit(); } };
    $('#treset').onclick = () => { tstate = ''; tinvalid = 0; tlog = []; $('#tin').disabled = false; drawChat(); };
    $('#tform').onsubmit = guard(async e => { e.preventDefault(); const t = $('#tin').value.trim(); if (!t) return;
      tlog.push({who: 'in', text: t}); $('#tin').value = ''; drawChat();
      const r = await api('/bot/test', 'POST', {flow: collect(), state: tstate, invalid: tinvalid, text: t});
      r.messages.forEach(m => tlog.push({who: 'out', text: m})); tstate = r.state; tinvalid = r.invalid; drawChat();
      if (r.handover) { $('#tin').disabled = true; toast('Handed over to the counsellor. Press Reset to try again.'); } });
  },

      toast(af.ai_enabled.checked ? 'Saved. The AI agent is answering WhatsApp messages.' : 'Saved. The agent is off.'); render(); });
    const fillv = t => t.replace(/\{\{\s*institute\s*\}\}/g, 'BTree Systems').replace(/\{\{\s*name\s*\}\}/g, 'there').replace(/\{\{\s*team_phone\s*\}\}/g, af.ai_team_phone.value || 'our office number');
    const draw = () => { $('#tbox').innerHTML = `<div class="msgs" style="padding:0">${test.map(m => `<div class="m ${m.role === 'user' ? 'in' : 'out'}">${m.kind ? `<span class="tap">${esc(m.kind)}</span><br>` : ''}${esc(m.content)}</div>`).join('')}</div>`; $('#tbox').scrollTop = 1e6; };
    $('#treset').onclick = () => { test = []; $('#tbox').innerHTML = '<div class="msgs muted" style="padding:0">Type a message as if you were a lead.</div>'; $('#tin').disabled = false; };
    $('#tform').onsubmit = guard(async e => { e.preventDefault(); const t = $('#tin').value.trim(); if (!t) return;
      const first = !test.some(m => m.role === 'user');
      test.push({role: 'user', content: t}); $('#tin').value = ''; draw();
      if (first) { test.push({role: 'assistant', content: fillv(af.ai_ack_message.value), kind: 'acknowledgement'}); draw(); }
      $('#tbtn').disabled = true;
      try {
        // the API sees the lead's turns and the agent's answers, like the live flow (acknowledgement excluded)
        const r = await api('/ai/test', 'POST', {messages: test.filter(m => m.kind !== 'acknowledgement' && m.kind !== 'hand-over').map(({role, content}) => ({role, content}))});
        if (r.reply) test.push({role: 'assistant', content: r.reply});
        if (r.handover) { test.push({role: 'assistant', content: r.handover_text, kind: 'hand-over'}); $('#tin').disabled = true; toast('Handed over to a counsellor. Press Reset to try again.'); }
        draw();
      } finally { $('#tbtn').disabled = false; } });
  },

  async Users() {
    const [users, meta] = await Promise.all([api('/users'), api('/users/roles')]);
    const roleOpts = sel => Object.entries(meta.roles).map(([k, r]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${esc(r.label)}</option>`).join('');
    const permBoxes = (role, perms) => Object.entries(meta.perms).map(([k, label]) =>
      `<label><input type="checkbox" name="perm" value="${k}" ${role === 'admin' || perms.includes(k) ? 'checked' : ''} ${role === 'admin' ? 'disabled' : ''}> ${esc(label)}</label>`).join('');
    const rolePill = r => pill(r === 'admin' ? 'def' : r === 'manager' ? 'interested' : 'idle', meta.roles[r] ? meta.roles[r].label : r);
    const access = u => u.role === 'admin' ? '<span class="muted">Everything</span>' : `${u.perms.length} of ${Object.keys(meta.perms).length} areas`;
    // Role presets fill the checkboxes; the admin can then fine-tune them per person.
    const bindRole = form => { const sel = form.role, box = form.querySelector('.perms'), about = form.querySelector('.about');
      const upd = () => { box.innerHTML = permBoxes(sel.value, meta.roles[sel.value].perms); about.textContent = meta.roles[sel.value].about; };
      sel.onchange = upd; about.textContent = meta.roles[sel.value].about; };
    const picked = form => [...form.querySelectorAll('input[name=perm]:checked')].map(x => x.value);
    $('#main').innerHTML = `
      <div class="card"><div class="sec" style="margin-top:0"><h2>Team members</h2><span class="sp"></span><span class="muted">${users.length} account${users.length === 1 ? '' : 's'}</span></div>
        <div class="tbl"><table><tr><th>Member</th><th>Role</th><th>Access</th><th>Status</th><th>Last sign-in</th><th style="text-align:right">Actions</th></tr>
        ${users.map(u => `<tr><td><div class="who">${avatar(u.name, true)}<div><b>${esc(u.name)}</b>${u.id === ME.id ? ' <span class="muted">(you)</span>' : ''}<div class="muted" style="font-size:12.5px">@${esc(u.username)}</div></div></div></td>
          <td>${rolePill(u.role)}</td><td>${access(u)}</td><td>${u.active ? pill('yes', 'active') : pill('no', 'disabled')}</td>
          <td>${u.last_login ? ago(u.last_login.replace(' ', 'T') + 'Z') : '<span class="muted">never</span>'}</td>
          <td style="text-align:right"><div class="row" style="gap:6px;justify-content:flex-end;flex-wrap:nowrap"><button class="b ghost sm" data-ed="${u.id}">Edit</button>${u.id !== ME.id ? `<button class="b danger sm" data-rm="${u.id}" data-n="${esc(u.name)}">Delete</button>` : ''}</div></td></tr>`).join('')}</table></div></div>
      <div class="two">
        <div class="card"><h2>Add a team member</h2>
          <form id="uf">
            <div class="row"><div style="flex:1;min-width:160px"><label>Full name</label><input name="name" required style="width:100%"></div>
              <div style="flex:1;min-width:160px"><label>Username</label><input name="username" required pattern="[A-Za-z0-9._\\-]{3,32}" style="width:100%" autocapitalize="none"></div></div>
            <div class="row"><div style="flex:1;min-width:160px"><label>Password (at least 8 characters)</label><input name="password" required minlength="8" style="width:100%" autocomplete="new-password"></div>
              <div style="flex:1;min-width:160px"><label>Role</label><select name="role" style="width:100%">${roleOpts('agent')}</select></div></div>
            <p class="muted about" style="font-size:12.5px;margin:8px 0 0"></p>
            <label>What they can access</label><div class="perms">${permBoxes('agent', meta.roles.agent.perms)}</div>
            <div class="row" style="margin-top:16px"><button class="b">Add member</button><button type="button" class="b ghost" id="gen">Suggest a password</button></div></form></div>
        <div class="card"><h2>Role presets</h2>
          <p class="muted" style="margin-top:0;font-size:13px">Pick a role when adding someone, then tick or untick areas to fine-tune. Only admins can manage users and roles.</p>
          <div class="tbl"><table class="matrix"><tr><th>Area</th>${Object.values(meta.roles).map(r => `<th>${esc(r.label)}</th>`).join('')}</tr>
          ${Object.entries(meta.perms).map(([k, label]) => `<tr><td>${esc(label)}</td>${Object.values(meta.roles).map(r => `<td>${r.perms.includes(k) ? '<span class="tick">✓</span>' : '<span class="dash">—</span>'}</td>`).join('')}</tr>`).join('')}
          <tr><td>Users &amp; roles</td>${Object.keys(meta.roles).map(k => `<td>${k === 'admin' ? '<span class="tick">✓</span>' : '<span class="dash">—</span>'}</td>`).join('')}</tr></table></div></div>
      </div>`;
    const uf = $('#uf'); bindRole(uf);
    $('#gen').onclick = () => { const a = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; uf.password.value = Array.from(crypto.getRandomValues(new Uint32Array(12)), n => a[n % a.length]).join(''); };
    uf.onsubmit = guard(async e => { e.preventDefault();
      await api('/users', 'POST', {name: uf.name.value, username: uf.username.value, password: uf.password.value, role: uf.role.value, perms: picked(uf)});
      toast(`Added ${uf.name.value}. Share the username and password with them.`); render(); });
    document.querySelectorAll('[data-rm]').forEach(b => b.onclick = guard(async () => {
      if (confirm(`Delete ${b.dataset.n}'s account? Their past messages stay in the chat history.`)) { await api('/users/' + b.dataset.rm, 'DELETE'); render(); } }));
    document.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => {
      const u = users.find(x => x.id == b.dataset.ed), m = document.createElement('div'); m.className = 'modal';
      m.innerHTML = `<div class="card" style="text-align:left;max-width:620px"><h2>Edit ${esc(u.name)} <span class="muted" style="font-weight:400">@${esc(u.username)}</span></h2>
        <form id="ef"><div class="row"><div style="flex:1;min-width:160px"><label>Full name</label><input name="name" value="${esc(u.name)}" required style="width:100%"></div>
          <div style="flex:1;min-width:160px"><label>Role</label><select name="role" style="width:100%">${roleOpts(u.role)}</select></div></div>
          <p class="muted about" style="font-size:12.5px;margin:8px 0 0"></p>
          <label>What they can access</label><div class="perms">${permBoxes(u.role, u.perms)}</div>
          <label>Reset password (leave empty to keep it)</label><input name="password" minlength="8" style="width:100%" autocomplete="new-password">
          <label class="row" style="margin-top:14px;gap:8px;color:var(--ink);font-weight:500"><input type="checkbox" name="active" ${u.active ? 'checked' : ''} ${u.id === ME.id ? 'disabled' : ''}> Account active (untick to block sign-in)</label>
          <div class="row" style="margin-top:18px;justify-content:flex-end"><button type="button" class="b ghost" id="ex">Cancel</button><button class="b">Save changes</button></div></form></div>`;
      document.body.appendChild(m);
      const ef = m.querySelector('#ef'); bindRole(ef);
      const close = () => m.remove(); m.onclick = e => { if (e.target === m) close(); }; m.querySelector('#ex').onclick = close;
      ef.onsubmit = guard(async e => { e.preventDefault();
        await api('/users/' + u.id, 'PUT', {name: ef.name.value, role: ef.role.value, perms: picked(ef), password: ef.password.value, active: u.id === ME.id ? true : ef.active.checked});
        close(); toast('Saved'); if (u.id === ME.id) { const r = await api('/auth/me'); ME = r.user; drawMe(); } render(); });
    });
  },

  async Courses() {
    $('#main').innerHTML = `
      <div class="card"><h2>Add or update a course</h2>
        <form id="cf" class="row"><input name="name" placeholder="Name" required><input name="fee" placeholder="Fee"><input name="duration" placeholder="Duration"><input name="batch_timing" placeholder="Batch timings"><input name="syllabus_url" placeholder="Syllabus URL"><button class="b">Save course</button></form></div>
      <div class="card"><div class="tbl"><table><tr><th>Course</th><th>Fee</th><th>Duration</th><th>Timings</th><th>Syllabus</th><th></th></tr>
      ${courses.map(c => `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.fee)}</td><td>${esc(c.duration)}</td><td>${esc(c.batch_timing)}</td><td>${esc(c.syllabus_url)}</td><td><div class="row" style="flex-wrap:nowrap"><button class="b ghost sm" data-e="${c.id}">Edit</button><button class="b danger sm" data-d="${c.id}">Delete</button></div></td></tr>`).join('')}</table></div></div>`;
    const f = $('#cf'); let editing = null;
    f.onsubmit = guard(async e => { e.preventDefault(); const p = Object.fromEntries(new FormData(f));
      editing ? await api('/courses/' + editing, 'PUT', p) : await api('/courses', 'POST', p); toast('Saved'); render(); });
    document.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { const c = courses.find(x => x.id == b.dataset.e); editing = c.id;
      for (const k of ['name', 'fee', 'duration', 'batch_timing', 'syllabus_url']) f[k].value = c[k]; });
    document.querySelectorAll('[data-d]').forEach(b => b.onclick = guard(async () => { if (confirm('Delete course?')) { await api('/courses/' + b.dataset.d, 'DELETE'); render(); } }));
  },

  async Webhooks() {
    const s = await api('/whatsapp/status');
    if (cfg.mode !== 'openwa') {
      $('#main').innerHTML = `<div class="card"><h2>Webhook for this CRM</h2><label>Callback URL</label><input readonly style="width:100%" value="${esc(s.webhook_url)}" onclick="this.select()"><label>Verify token</label><input readonly style="width:100%" value="${esc(s.verify_token)}" onclick="this.select()"><p class="muted" style="font-size:12.5px">Cloud mode: register this in Meta App Dashboard → WhatsApp → Configuration.</p></div>`; return; }
    const hooks = await api('/openwa/webhooks');
    $('#main').innerHTML = `
      <div class="card"><div class="sec" style="margin-top:0"><h2>Registered webhooks</h2><span class="sp"></span><button class="b sm" id="reg">Re-register</button></div>
        <div class="tbl"><table><tr><th>Destination URL</th><th>Events</th><th>Status</th><th style="text-align:right">Actions</th></tr>
        ${hooks.map(h => `<tr><td class="mono">${esc(h.url)}</td><td><div class="row" style="gap:6px">${h.events.map(e => `<span class="pill def">${esc(e)}</span>`).join('')}</div></td><td>${h.active ? pill('yes', 'active') : pill('no', 'inactive')}</td><td style="text-align:right"><button class="b ghost sm" data-t="${h.id}">Send test</button></td></tr>`).join('') || '<tr><td colspan="4"><div class="empty">No webhook registered. Press Re-register.</div></td></tr>'}</table></div></div>
      <div class="two">
        <div class="card"><h2>How it works</h2>
          <p class="muted" style="margin-top:0">When someone messages your linked number, WhatsApp calls this URL. The CRM creates the lead, runs the bot and logs delivery updates.</p>
          <div class="kv"><span class="muted">Our endpoint</span><span class="mono">${esc(s.openwa_webhook_url)}</span></div>
          <div class="kv"><span class="muted">Signed with secret</span>${pill('yes', 'HMAC-SHA256')}</div></div>
        <div class="card"><h2>Test result</h2><div class="res" id="wres">Press “Send test” to have WhatsApp call the CRM.</div></div>
      </div>`;
    $('#reg').onclick = guard(async () => { await api('/openwa/setup', 'POST'); toast('Webhook registered'); render(); });
    document.querySelectorAll('[data-t]').forEach(b => b.onclick = guard(async () => { const r = await api(`/openwa/webhooks/${b.dataset.t}/test`, 'POST'); $('#wres').textContent = JSON.stringify(r, null, 2); toast(r.success ? 'CRM answered ' + r.statusCode : 'Delivery failed'); }));
  },

  async Tester() {
    if (cfg.mode !== 'openwa') { $('#main').innerHTML = '<div class="card"><div class="empty">The message tester needs <code>WA_MODE=gateway</code> in .env.</div></div>'; return; }
    const [sess, tpls] = await Promise.all([api('/openwa/sessions'), api('/templates')]);
    const hist = JSON.parse(sessionStorage.getItem('mt') || '[]');
    $('#main').innerHTML = `
      <div class="two">
        <div class="card"><h2>Send a test message</h2>
          <div class="note">${ico('alert')}<div>This sends a real WhatsApp message from your linked number. Only message numbers you own or people who agreed to hear from you.</div></div>
          <form id="mf">
            <label>Session</label><select name="session_id" style="width:100%">${sess.map(s => `<option value="${s.id}" ${s.is_default ? 'selected' : ''}>${esc(s.name)} · ${esc(s.status)}${s.phone ? ' · ' + esc(s.phone) : ''}</option>`).join('')}</select>
            <label>To (phone number)</label><input name="phone" placeholder="9876543210" required style="width:100%">
            <label>Start from a template (optional)</label><select id="mtp" style="width:100%"><option value="">— none —</option>${tpls.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select>
            <label>Message <span id="cnt" class="muted" style="font-weight:400"></span></label>
            <textarea name="text" required maxlength="4096" placeholder="Type your message"></textarea>
            <div class="row" style="margin-top:14px"><button class="b" id="mbtn">${ico('Tester')}Send message</button></div></form></div>
        <div class="card"><h2>Result</h2><div class="res" id="mres">Nothing sent yet.</div>
          <h2 style="margin-top:22px">Recent tests</h2><div id="mh">${hist.length ? '' : '<div class="muted">None yet.</div>'}</div></div>
      </div>`;
    const f = $('#mf'), cnt = () => $('#cnt').textContent = `(${f.text.value.length}/4096)`; f.text.oninput = cnt; cnt();
    const drawHist = h => { $('#mh').innerHTML = h.map(x => `<div class="kv"><span><b>${esc(x.to)}</b> <span class="muted">${esc(x.text.slice(0, 40))}${x.text.length > 40 ? '…' : ''}</span></span><span>${x.ok ? pill('yes', x.ms + ' ms') : pill('failed', 'failed')}</span></div>`).join(''); };
    drawHist(hist);
    $('#mtp').onchange = e => { const t = tpls.find(x => x.id == e.target.value); if (t) { f.text.value = t.body; cnt(); } };
    f.onsubmit = guard(async e => { e.preventDefault(); const btn = $('#mbtn'); btn.disabled = true;
      const body = {phone: f.phone.value, text: f.text.value, session_id: f.session_id.value}; let h = JSON.parse(sessionStorage.getItem('mt') || '[]');
      try { const r = await api('/openwa/send-test', 'POST', body); $('#mres').textContent = JSON.stringify(r, null, 2); h.unshift({to: r.to, text: body.text, ok: true, ms: r.ms}); toast('Message sent'); }
      catch (err) { $('#mres').textContent = 'Failed: ' + err.message; h.unshift({to: body.phone, text: body.text, ok: false, ms: 0}); }
      finally { h = h.slice(0, 8); sessionStorage.setItem('mt', JSON.stringify(h)); drawHist(h); btn.disabled = false; } });
  },
};
Object.assign(views, window.PageViews || {});   // Live Chat, Contacts and Campaigns live in their own files

const drawer = open => { document.documentElement.classList.toggle('nav-open', open); $('#menu').setAttribute('aria-expanded', open); };
$('#menu').onclick = () => drawer(true);
// Back/forward buttons and #links switch pages too.
addEventListener('hashchange', () => { const h = decodeURIComponent(location.hash.slice(1));
  if (ME && h && h !== tab && TABS.some(t => t.id === h)) { tab = h; localStorage.setItem('tab', tab); drawer(false); render(); } });
$('#scrim').onclick = () => drawer(false);
document.addEventListener('keydown', e => { if (e.key === 'Escape') drawer(false); });
$('#fold').onclick = () => { const c = document.documentElement.classList.toggle('collapsed'); try { localStorage.setItem('side', c ? '1' : '0'); } catch (e) {} };
$('#logout').onclick = async () => { await fetch('/api/auth/logout', {method: 'POST'}); location.href = '/login'; };
function drawMe() {
  $('#mebtn').innerHTML = `${avatar(ME.name, true)}<div><b>${esc(ME.name)}</b><small><i>${esc(ME.role)}</i> · @${esc(ME.username)}</small></div>`;
  $('#mebtn').onclick = openAccount;
}
function openAccount() {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card" style="text-align:left"><div class="row" style="margin-bottom:6px">${avatar(ME.name)}<div><b style="font-size:16px">${esc(ME.name)}</b><div class="muted">@${esc(ME.username)} · ${esc(ME.role)}</div></div></div>
    <h2 style="margin-top:18px">Change password</h2>
    <form id="pwf"><label>Current password</label><input type="password" name="current" required style="width:100%" autocomplete="current-password">
      <label>New password (at least 8 characters)</label><input type="password" name="new" required minlength="8" style="width:100%" autocomplete="new-password">
      <div class="row" style="margin-top:16px;justify-content:flex-end"><button type="button" class="b ghost" id="pwx">Close</button><button class="b">Update password</button></div></form></div>`;
  document.body.appendChild(m);
  const close = () => m.remove();
  m.onclick = e => { if (e.target === m) close(); }; m.querySelector('#pwx').onclick = close;
  m.querySelector('#pwf').onsubmit = guard(async e => { e.preventDefault(); const f = e.target;
    await api('/auth/password', 'POST', {current: f.current.value, new: f.new.value}); toast('Password updated'); close(); });
}
(async () => {
  const m = await api('/auth/me');
  if (!m.signed_in) { location.href = '/login'; return; }
  ME = m.user; drawMe();
  await refreshStatus();
  render().catch(e => toast(e.message));
})();
setInterval(() => { if (!document.hidden) refreshStatus(); }, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshStatus(); });
</script>
</body>
</html>
